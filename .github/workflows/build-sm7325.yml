name: build-sm7325

on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: "KernelSU 变体"
        type: choice
        options:
          - reukisu
          - none
        default: reukisu
      build_variant:
        description: "构建变体"
        type: choice
        options:
          - resukisu
          - lkm
        default: resukisu
      enable_userns:
        description: "启用 CONFIG_USER_NS"
        type: boolean
        default: true
      use_ccache:
        description: "启用 ccache"
        type: boolean
        default: true
      kernel_repo:
        description: "内核源码仓库地址（GitHub 格式 owner/repo）"
        type: string
        default: "Kosiou/android_kernel_samsung_sm7325"
      kernel_branch:
        description: "内核源码分支"
        type: string
        default: "main"

permissions:
  contents: write

env:
  KERNEL_REPO: ${{ github.event.inputs.kernel_repo || 'Kosiou/android_kernel_samsung_sm7325' }}
  KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch || 'main' }}
  DEFCONFIG: vendor/gts7fewifi_eur_open_defconfig
  DEVICE_CODENAME: gts7fewifi
  LOCALVERSION_BASE: "-qgki-Kokuban-Perica-DYF1"
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  TOOLCHAIN_BASE: ${{ github.workspace }}/toolchains

jobs:
  build:
    name: "SM7325-${{ inputs.build_variant || 'resukisu' }}${{ inputs.ksu_variant == 'reukisu' && '-KSU' || '' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ── 克隆内核源码 ───────────────────────────────────────────────
      - name: 克隆内核源码
        run: |
          REPO_URL="https://github.com/${{ env.KERNEL_REPO }}.git"
          echo "克隆: $REPO_URL (分支: ${{ env.KERNEL_BRANCH }})"
          git clone --depth=1 -b "${{ env.KERNEL_BRANCH }}" "$REPO_URL" "$GITHUB_WORKSPACE/kernel"
          cd "$GITHUB_WORKSPACE/kernel"
          echo "分支: $(git rev-parse --abbrev-ref HEAD)"
          echo "最新提交: $(git log -1 --format='%h %s')"
          echo "ROOT=$GITHUB_WORKSPACE/kernel" >> "$GITHUB_ENV"

      # ── 系统信息 ──────────────────────────────────────────────────
      - name: 显示系统信息
        run: |
          echo "Runner: ${{ runner.os }} ($(uname -m))"
          echo "Make: $(make --version | head -1)"
          echo "GCC: $(gcc --version | head -1 2>/dev/null || echo 'not found')"
          echo "CPU cores: $(nproc)"

      # ── 安装编译依赖 ─────────────────────────────────────────────
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y bison flex libelf-dev dwarves cpio unzip zip binutils \
            bc libssl-dev python3 ccache git

      # ── GNU Make 4.3（5.4 内核要求）──────────────────────────────
      - name: 安装 GNU Make 4.3
        run: |
          cd /tmp
          curl -fsSL https://ftp.gnu.org/gnu/make/make-4.3.tar.gz -o make.tar.gz
          tar xzf make.tar.gz
          cd make-4.3
          ./configure --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
          /usr/local/bin/make --version | head -1
          echo "PATH=/usr/local/bin:$PATH" >> "$GITHUB_ENV"

      # ── ccache ────────────────────────────────────────────────────
      - name: 配置 ccache
        if: inputs.use_ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --max-size=2G
          ccache --set-config compression=true
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"

      - name: 恢复 ccache
        if: inputs.use_ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: sm7325-ccache-${{ inputs.build_variant }}-${{ hashFiles('kernel/arch/arm64/configs/vendor/gts7fewifi_eur_open_defconfig') }}
          restore-keys: |
            sm7325-ccache-${{ inputs.build_variant }}-
            sm7325-ccache-

      # ── 下载工具链 ────────────────────────────────────────────────
      # 来源: https://github.com/ravindu644/Android-Kernel-Tutorials
      # 5.4 (qGKI) 需要: clang-r416183b + ARM GNU 14.2
      - name: 下载工具链
        id: toolchain
        run: |
          CLANG_DIR="$TOOLCHAIN_BASE/clang-r416183b"
          GCC_DIR="$TOOLCHAIN_BASE/arm-gnu-14.2"
          CLANG_URL="https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r416183b.tar.gz"
          GCC_URL="https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz"

          CLANG_OK=false
          GCC_OK=false

          # 检查是否已有
          if [ -x "$CLANG_DIR/bin/clang" ]; then
            echo "发现本地 clang: $CLANG_DIR/bin/clang"
            CLANG_OK=true
          fi
          if [ -x "$GCC_DIR/bin/aarch64-linux-gnu-as" ]; then
            echo "发现本地 gcc: $GCC_DIR"
            GCC_OK=true
          fi

          if [ "$CLANG_OK" = true ] && [ "$GCC_OK" = true ]; then
            echo "工具链已存在，跳过下载"
            echo "FOUND=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 下载 clang-r416183b
          if [ "$CLANG_OK" = false ]; then
            echo "下载 clang-r416183b..."
            mkdir -p "$TOOLCHAIN_BASE"
            cd "$TOOLCHAIN_BASE"
            curl -Lf --progress-bar "$CLANG_URL" -o clang.tar.gz
            tar xzf clang.tar.gz
            rm -f clang.tar.gz
            if [ -x "$CLANG_DIR/bin/clang" ]; then
              echo "clang 下载成功: $CLANG_DIR/bin/clang"
              CLANG_OK=true
            else
              echo "::warning::clang 解压后目录名可能不同，尝试自动定位"
              # clang-r416183b 解压后可能是 clang-r416183b/ 或直接在顶层
              FOUND_CLANG=$(find "$TOOLCHAIN_BASE" -name "clang" -type f 2>/dev/null | head -1)
              if [ -n "$FOUND_CLANG" ]; then
                CLANG_DIR=$(dirname "$(dirname "$FOUND_CLANG")")
                echo "自动定位 clang: $CLANG_DIR"
                CLANG_OK=true
              fi
            fi
          fi

          # 下载 ARM GNU 14.2
          if [ "$GCC_OK" = false ]; then
            echo "下载 ARM GNU toolchain 14.2..."
            mkdir -p "$TOOLCHAIN_BASE"
            cd "$TOOLCHAIN_BASE"
            curl -Lf --progress-bar "$GCC_URL" -o gcc.tar.xz
            tar xJf gcc.tar.xz
            rm -f gcc.tar.xz
            # ARM GNU toolchain 解压后目录名包含版本信息
            FOUND_GCC=$(find "$TOOLCHAIN_BASE" -name "aarch64-linux-gnu-as" -type f 2>/dev/null | head -1)
            if [ -n "$FOUND_GCC" ]; then
              GCC_DIR=$(dirname "$(dirname "$FOUND_GCC")")
              echo "gcc 定位: $GCC_DIR"
              GCC_OK=true
            fi
          fi

          if [ "$CLANG_OK" = false ]; then
            echo "::error::clang-r416183b 下载失败"
            exit 1
          fi

          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"
          echo "GCC_DIR=$GCC_DIR" >> "$GITHUB_ENV"
          echo "FOUND=true" >> "$GITHUB_OUTPUT"

      # ── 建立 toolchain 软链接 ────────────────────────────────────
      - name: 建立 toolchain 软链接
        run: |
          CLANG_DIR="${{ env.CLANG_DIR }}"
          GCC_DIR="${{ env.GCC_DIR }}"
          TOOLCHAIN_BIN="$GITHUB_WORKSPACE/kernel/toolchain/bin"
          mkdir -p "$TOOLCHAIN_BIN"

          # 清理旧链接
          rm -f "$TOOLCHAIN_BIN"/aarch64-linux-gnu-* "$TOOLCHAIN_BIN"/cc "$TOOLCHAIN_BIN"/gcc "$TOOLCHAIN_BIN"/g++

          # 找 clang 可执行文件
          if [ -x "$CLANG_DIR/bin/clang" ]; then
            CLANG="$CLANG_DIR/bin/clang"
            CLANG12="$CLANG_DIR/bin/clang-12"
          elif ls "$CLANG_DIR/bin"/clang-12* &>/dev/null; then
            CLANG12=$(ls "$CLANG_DIR/bin"/clang-12* | head -1)
            CLANG="$CLANG12"
          else
            echo "::error::找不到 clang 可执行文件: $CLANG_DIR"
            ls -la "$CLANG_DIR/bin/" 2>/dev/null | head -20
            exit 1
          fi

          echo "Clang: $CLANG"
          $CLANG --version | head -1

          # 找 ARM GNU as/ld
          if [ -x "$GCC_DIR/aarch64-linux-gnu/bin/aarch64-linux-gnu-as" ]; then
            GCC_BIN="$GCC_DIR/aarch64-linux-gnu/bin"
          elif [ -x "$GCC_DIR/bin/aarch64-linux-gnu-as" ]; then
            GCC_BIN="$GCC_DIR/bin"
          else
            GCC_BIN=""
            echo "::warning::未找到 ARM GNU toolchain，使用 clang integrated assembler"
          fi

          # 建立 aarch64 前缀链接
          ln -sf "$CLANG" "$TOOLCHAIN_BIN/aarch64-linux-gnu-gcc"
          ln -sf "$CLANG" "$TOOLCHAIN_BIN/aarch64-linux-gnu-g++"
          ln -sf "$CLANG" "$TOOLCHAIN_BIN/cc"
          ln -sf "$CLANG" "$TOOLCHAIN_BIN/gcc"
          ln -sf "$CLANG12" "$TOOLCHAIN_BIN/g++" 2>/dev/null || ln -sf "$CLANG" "$TOOLCHAIN_BIN/g++"

          for tool in ld ar nm objcopy objdump strip; do
            src="$CLANG_DIR/bin/llvm-${tool}"
            [ -x "$src" ] && ln -sf "$src" "$TOOLCHAIN_BIN/aarch64-linux-gnu-${tool}"
          done
          # llvm-ar 有时叫 llvm-ar
          [ -x "$CLANG_DIR/bin/llvm-ar" ] && ln -sf "$CLANG_DIR/bin/llvm-ar" "$TOOLCHAIN_BIN/aarch64-linux-gnu-ar"

          # GNU as（5.4 内核需要外部 assembler）
          if [ -n "$GCC_BIN" ] && [ -x "$GCC_BIN/aarch64-linux-gnu-as" ]; then
            ln -sf "$GCC_BIN/aarch64-linux-gnu-as" "$TOOLCHAIN_BIN/aarch64-linux-gnu-as"
            echo "GNU as: $GCC_BIN/aarch64-linux-gnu-as"
          fi

          echo "toolchain/bin:"
          ls -la "$TOOLCHAIN_BIN"

      # ── 集成 KernelSU (ReSukiSU) ─────────────────────────────────
      - name: 集成 KernelSU (ReSukiSU)
        if: inputs.ksu_variant == 'reukisu'
        run: |
          KERNEL_ROOT="$GITHUB_WORKSPACE/kernel"
          echo "克隆 ReSukiSU..."
          if [ ! -d "$KERNEL_ROOT/KernelSU" ]; then
            git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git "$KERNEL_ROOT/KernelSU"
          fi
          cd "$KERNEL_ROOT/KernelSU"
          cd "$KERNEL_ROOT"

          DRIVER_DIR="$KERNEL_ROOT/drivers"
          KSU_KERNEL_DIR="$KERNEL_ROOT/KernelSU/kernel"

          # 创建驱动链接
          if [ ! -L "$DRIVER_DIR/kernelsu" ]; then
            ln -sf "../../KernelSU/kernel" "$DRIVER_DIR/kernelsu"
            echo "已创建 drivers/kernelsu -> KernelSU/kernel"
          fi

          # 确保 Makefile 包含 KSU
          if ! grep -q "kernelsu" "$DRIVER_DIR/Makefile"; then
            echo '' >> "$DRIVER_DIR/Makefile"
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> "$DRIVER_DIR/Makefile"
            echo "已添加 KSU 到 drivers/Makefile"
          fi

          # 确保 Kconfig 包含 KSU
          if ! grep -q "drivers/kernelsu/Kconfig" "$DRIVER_DIR/Kconfig"; then
            sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' "$DRIVER_DIR/Kconfig"
            echo "已添加 KSU 到 drivers/Kconfig"
          fi

          echo "KernelSU 集成完成"

      # ── 配置内核选项 ─────────────────────────────────────────────
      - name: 配置内核选项
        run: |
          KERNEL_ROOT="$GITHUB_WORKSPACE/kernel"
          DEFCONFIG="$KERNEL_ROOT/arch/arm64/configs/vendor/gts7fewifi_eur_open_defconfig"

          # 按 workflow 输入控制 CONFIG_USER_NS
          if [ "${{ inputs.enable_userns }}" = "true" ] && ! grep -q "^CONFIG_USER_NS=y" "$DEFCONFIG"; then
            sed -i '/^CONFIG_NAMESPACES=y$/a CONFIG_USER_NS=y' "$DEFCONFIG"
            echo "已添加 CONFIG_USER_NS=y"
          fi

          # 确保生成 ARM64 device tree overlay
          if ! grep -q "^CONFIG_BUILD_ARM64_DT_OVERLAY=y" "$DEFCONFIG"; then
            echo "CONFIG_BUILD_ARM64_DT_OVERLAY=y" >> "$DEFCONFIG"
            echo "已添加 CONFIG_BUILD_ARM64_DT_OVERLAY=y"
          fi

          # 确保 KSU 配置存在
          for opt in \
            "CONFIG_KSU=y" \
            "CONFIG_KSU_MANUAL_HOOK=y" \
            "CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y" \
            "CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y" \
            "CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y"; do
            cfg="${opt%%=*}"
            if ! grep -q "^${cfg}=" "$DEFCONFIG"; then
              echo "$opt" >> "$DEFCONFIG"
              echo "已添加 $opt"
            fi
          done

          echo "── 关键配置 ──"
          grep -E "CONFIG_USER_NS|CONFIG_KSU|CONFIG_NAMESPACES|CONFIG_PID_NS|CONFIG_SYSVIPC|CONFIG_POSIX_MQUEUE" "$DEFCONFIG"

      # ── 准备 AnyKernel3 ──────────────────────────────────────────
      - name: 准备 AnyKernel3
        run: |
          KERNEL_ROOT="$GITHUB_WORKSPACE/kernel"
          AK3_DIR="$KERNEL_ROOT/build/AnyKernel3"
          if [ ! -d "$AK3_DIR" ]; then
            git clone --depth=1 https://github.com/WildKernels/AnyKernel3.git "$AK3_DIR"
          fi
          rm -rf "$AK3_DIR/.git"
          echo "AnyKernel3: $AK3_DIR"

      # ── 编译内核 ─────────────────────────────────────────────────
      - name: 编译内核
        id: compile
        run: |
          set -e
          KERNEL_ROOT="$GITHUB_WORKSPACE/kernel"
          TOOLCHAIN_BIN="$KERNEL_ROOT/toolchain/bin"
          CLANG_DIR="${{ env.CLANG_DIR }}"

          export PATH="$TOOLCHAIN_BIN:$CLANG_DIR/bin:$PATH"
          export ARCH=arm64
          export DTC_EXT="$KERNEL_ROOT/tools/dtc"

          # 5.4 qGKI 需要 CROSS_COMPILE（指向 ARM GNU as/ld）+ LLVM=1
          # 根据 ravindu644 教程：5.4 需要 Clang + GCC cross compiler
          export CROSS_COMPILE="${{ env.GCC_DIR }}/bin/aarch64-linux-gnu-"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LLVM=1
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          # ccache
          if [ -n "${{ inputs.use_ccache }}" ] && command -v ccache &>/dev/null; then
            export CC="ccache clang"
            echo "ccache 已启用"
          fi

          OUT_DIR="$KERNEL_ROOT/out"
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          VARIANT="${{ inputs.build_variant || 'resukisu' }}"
          LOCALVERSION="${{ env.LOCALVERSION_BASE }}-GitHubBuild"

          echo "=============================================="
          echo " SM7325 Kernel Build"
          echo "=============================================="
          echo " Device:    ${{ env.DEVICE_CODENAME }}"
          echo " Defconfig: ${{ env.DEFCONFIG }}"
          echo " Variant:   $VARIANT"
          echo " Version:   $LOCALVERSION"
          echo " CC:        $CLANG_DIR/bin/clang"
          echo " CROSS:     $CROSS_COMPILE"
          echo " DTC_EXT:   $DTC_EXT"
          echo " JOBS:      $(nproc)"
          echo " OUT:       $OUT_DIR"
          echo "=============================================="

          # [1/3] 生成 .config
          echo ""; echo "[1/3] 生成 .config..."
          make -j"$(nproc)" -C "$KERNEL_ROOT" O="$OUT_DIR" \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            DTC_EXT="$DTC_EXT" \
            LLVM=1 \
            CC=clang \
            LD=ld.lld \
            "${{ env.DEFCONFIG }}"

          # [2/3] 编译
          echo ""; echo "[2/3] 编译内核..."
          make -j"$(nproc)" -C "$KERNEL_ROOT" O="$OUT_DIR" \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            DTC_EXT="$DTC_EXT" \
            LLVM=1 \
            CC=clang \
            LD=ld.lld \
            LOCALVERSION="$LOCALVERSION"

          # 验证 Image
          IMAGE="$OUT_DIR/arch/arm64/boot/Image"
          if [ ! -f "$IMAGE" ]; then
            echo "::error::Image 未找到: $IMAGE"
            echo "构建日志 tail:"
            tail -80 "$OUT_DIR/build.log" 2>/dev/null || true
            exit 1
          fi
          echo ""
          echo "✓ 内核编译成功"
          echo "  大小: $(ls -lh "$IMAGE" | awk '{print $5}')"
          echo "  版本: $(strings "$IMAGE" | grep 'Linux version' | head -1)"

          # [3/3] 打包 AnyKernel3
          echo ""; echo "[3/3] 打包 AnyKernel3..."
          AK3_DIR="$KERNEL_ROOT/build/AnyKernel3"
          rm -rf "${AK3_DIR}/Image" "${AK3_DIR}/dtb" "${AK3_DIR}/dtbo.img" "${AK3_DIR}/modules" 2>/dev/null || true

          cp "$IMAGE" "$AK3_DIR/" && echo "  ✓ Image"
          mkdir -p "$AK3_DIR/dtb"
          find "$OUT_DIR/arch/arm64/boot/dts" -name "*.dtb" -exec cp {} "$AK3_DIR/dtb/" \; 2>/dev/null && echo "  ✓ DTB" || true
          [ -f "$OUT_DIR/arch/arm64/boot/dtbo.img" ] && cp "$OUT_DIR/arch/arm64/boot/dtbo.img" "$AK3_DIR/" && echo "  ✓ DTBO" || true

          # 收集模块
          if ls "$OUT_DIR"/*.ko 2>/dev/null | head -1 > /dev/null; then
            mkdir -p "$AK3_DIR/modules"
            find "$OUT_DIR" -name "*.ko" -not -path "*/vendor/*" -exec cp {} "$AK3_DIR/modules/" \; 2>/dev/null
            echo "  ✓ Modules"
          fi

          TIMESTAMP=$(date '+%Y%m%d-%H%M%S')
          ZIP_NAME="TabS7FE_Kernel-${VARIANT}-${TIMESTAMP}-GitHub.zip"
          (cd "$AK3_DIR" && zip -r9 "$OUT_DIR/$ZIP_NAME" . -x '.git*' '*.gitignore' 'README*' '*placeholder')

          echo ""
          echo "=============================================="
          echo " BUILD SUCCESS"
          echo "=============================================="
          echo " Artifact: $OUT_DIR/$ZIP_NAME"
          ls -lh "$OUT_DIR/$ZIP_NAME"
          echo "=============================================="

          echo "ZIP_PATH=$OUT_DIR/$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      # ── 上传产物 ──────────────────────────────────────────────────
      - name: 上传内核 zip
        uses: actions/upload-artifact@v6
        with:
          name: kernel-${{ inputs.build_variant || 'resukisu' }}
          path: ${{ steps.compile.outputs.ZIP_PATH }}
          retention-days: 14

      - name: 上传 .config（失败时调试用）
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: config-${{ inputs.build_variant || 'resukisu' }}
          path: ${{ github.workspace }}/kernel/out/.config
          retention-days: 7
