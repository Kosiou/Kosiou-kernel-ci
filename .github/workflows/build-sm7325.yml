name: build-sm7325

on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: "KernelSU 变体"
        type: choice
        options:
          - reukisu
          - none
        default: reukisu
      build_variant:
        description: "构建变体（resukisu=KSU 内建, lkm=KSU 编为模块）"
        type: choice
        options:
          - resukisu
          - lkm
        default: resukisu
      use_ccache:
        description: "启用 ccache"
        type: boolean
        default: true
      kernel_repo:
        description: "内核源码仓库地址（GitHub 格式 owner/repo）"
        type: string
        default: "Kosiou/android_kernel_samsung_sm7325"
      kernel_branch:
        description: "内核源码分支"
        type: string
        default: "main"

permissions:
  contents: write

env:
  KERNEL_REPO: ${{ github.event.inputs.kernel_repo || 'Kosiou/android_kernel_samsung_sm7325' }}
  KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch || 'main' }}
  HYBRID_MOUNT_REPO: https://github.com/Hybrid-Mount/meta-hybrid_mount.git
  REKERNEL_REPO: Sakion-Team/Re-Kernel
  DEFCONFIG: vendor/gts7fewifi_eur_open_defconfig
  DEVICE_CODENAME: gts7fewifi
  LOCALVERSION_BASE: "-Kosiou"
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  TOOLCHAIN_BASE: ${{ github.workspace }}/toolchains

jobs:
  build:
    name: "SM7325-${{ inputs.build_variant || 'resukisu' }}${{ inputs.ksu_variant == 'reukisu' && (inputs.build_variant == 'lkm' && '-KSU-lkm' || '-KSU') || '-noKSU' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      ksu_sha: ${{ steps.ksu_sha.outputs.ksu_sha }}
      ksu_tag: ${{ steps.ksu_sha.outputs.ksu_tag }}
      ksu_manager_url: ${{ steps.ksu_sha.outputs.ksu_manager_url }}

    steps:
      # ── 克隆内核源码 ───────────────────────────────────────────────
      - name: 克隆内核源码
        run: |
          REPO_URL="https://github.com/${{ env.KERNEL_REPO }}.git"
          echo "克隆: $REPO_URL (分支: ${{ env.KERNEL_BRANCH }})"
          git clone --depth=1 -b "${{ env.KERNEL_BRANCH }}" "$REPO_URL" "$GITHUB_WORKSPACE/kernel"
          cd "$GITHUB_WORKSPACE/kernel"
          echo "分支: $(git rev-parse --abbrev-ref HEAD)"
          echo "最新提交: $(git log -1 --format='%h %s')"
          echo "ROOT=$GITHUB_WORKSPACE/kernel" >> "$GITHUB_ENV"

      - name: 清理仓库内固定 Re-Kernel 集成
        run: |
          set -euo pipefail
          KERNEL_ROOT="$GITHUB_WORKSPACE/kernel"
          INTEGRATION_COMMIT="976d2fcf9bd7e4e1ac9271ce1c2eeff02980281c"

          # Revert the vendored integration before KSU and VFS modify shared build files.
          git -C "$KERNEL_ROOT" fetch --no-tags --depth=2 origin "$INTEGRATION_COMMIT"
          git -C "$KERNEL_ROOT" cat-file -e "${INTEGRATION_COMMIT}^{commit}"
          git -C "$KERNEL_ROOT" revert --no-commit "$INTEGRATION_COMMIT"
          echo "Removed pinned Re-Kernel integration from this build checkout."

      # ── 系统信息 ──────────────────────────────────────────────────
      - name: 显示系统信息
        run: |
          echo "Runner: ${{ runner.os }} ($(uname -m))"
          echo "Make: $(make --version | head -1)"
          echo "GCC: $(gcc --version | head -1 2>/dev/null || echo 'not found')"
          echo "CPU cores: $(nproc)"

      # ── 安装编译依赖 ─────────────────────────────────────────────
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y bison flex libelf-dev dwarves cpio unzip zip binutils \
            bc libssl-dev python3 ccache git

      # ── GNU Make 4.3（5.4 内核要求 < 4.4）────────────────────────
      # ubuntu-latest (24.04) 自带 4.3, 仅在系统 make >= 4.4 时才编译
      - name: 安装 GNU Make 4.3（仅系统版本过新时）
        run: |
          SYSTEM_MAJOR=$(make --version | head -1 | grep -oE '[0-9]+\.[0-9]+')
          NEED_BUILD=false
          if dpkg --compare-versions "$SYSTEM_MAJOR" ge "4.4"; then
            NEED_BUILD=true
          fi
          if [ "$NEED_BUILD" = true ]; then
            echo "系统 make $SYSTEM_MAJOR 过新, 编译 4.3..."
            cd /tmp
            curl -fsSL https://ftp.gnu.org/gnu/make/make-4.3.tar.gz -o make.tar.gz
            tar xzf make.tar.gz
            cd make-4.3
            ./configure --prefix=/usr/local
            make -j"$(nproc)"
            sudo make install
            echo "PATH=/usr/local/bin:$PATH" >> "$GITHUB_ENV"
            /usr/local/bin/make --version | head -1
          else
            echo "系统 make $SYSTEM_MAJOR 可用, 跳过"
          fi

      # ── ccache ────────────────────────────────────────────────────
      - name: 配置 ccache
        if: inputs.use_ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --max-size=2G
          ccache --set-config compression=true
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"

      - name: 恢复 ccache
        if: inputs.use_ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          # 固定 key: hashFiles 在 workflow 解析期求值, kernel/ 尚未克隆, 恒为空
          # defconfig 变化不会使缓存失效 — 由 restore-keys 兜底, 手动清缓存可走
          # Actions → Caches 页面删除
          key: sm7325-ccache-${{ inputs.build_variant }}-${{ inputs.ksu_variant }}
          restore-keys: |
            sm7325-ccache-${{ inputs.build_variant }}-
            sm7325-ccache-

      # ── 下载工具链 ────────────────────────────────────────────────
      # 来源: https://github.com/ravindu644/Android-Kernel-Tutorials
      # 5.4 (qGKI) 需要: clang-r416183b + ARM GNU 14.2
      - name: 下载工具链
        id: toolchain
        run: |
          # clang 压缩包直接包含 bin/，解压根目录就是 TOOLCHAIN_BASE
          CLANG_DIR="$TOOLCHAIN_BASE"
          GCC_DIR="$TOOLCHAIN_BASE/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu"
          CLANG_URL="https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r416183b.tar.gz"
          GCC_URL="https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz"

          CLANG_OK=false
          GCC_OK=false
          GCC_BIN="$GCC_DIR/bin"
          GCC_PREFIX="aarch64-none-linux-gnu-"

          # 检查是否已有
          if [ -x "$CLANG_DIR/bin/clang" ]; then
            echo "发现本地 clang: $CLANG_DIR/bin/clang"
            CLANG_OK=true
          fi
          if [ -x "$GCC_BIN/${GCC_PREFIX}as" ]; then
            echo "发现本地 gcc: $GCC_BIN/${GCC_PREFIX}as"
            GCC_OK=true
          fi

          # 下载 clang-r416183b
          if [ "$CLANG_OK" = false ]; then
            echo "下载 clang-r416183b..."
            mkdir -p "$TOOLCHAIN_BASE"
            cd "$TOOLCHAIN_BASE"
            curl -Lf --retry 3 --progress-bar "$CLANG_URL" -o clang.tar.gz
            tar xzf clang.tar.gz
            rm -f clang.tar.gz
            if [ -x "$CLANG_DIR/bin/clang" ]; then
              echo "clang 下载成功: $CLANG_DIR/bin/clang"
              CLANG_OK=true
            fi
          fi

          # 下载 ARM GNU 14.2
          if [ "$GCC_OK" = false ]; then
            echo "下载 ARM GNU toolchain 14.2..."
            mkdir -p "$TOOLCHAIN_BASE"
            cd "$TOOLCHAIN_BASE"
            curl -Lf --retry 3 --progress-bar "$GCC_URL" -o gcc.tar.xz
            tar xJf gcc.tar.xz
            rm -f gcc.tar.xz
            if [ -x "$GCC_BIN/${GCC_PREFIX}as" ]; then
              echo "gcc 定位: $GCC_BIN/${GCC_PREFIX}as"
              GCC_OK=true
            fi
          fi

          if [ "$CLANG_OK" = false ]; then
            echo "::error::clang-r416183b 下载失败"
            exit 1
          fi
          if [ "$GCC_OK" = false ]; then
            echo "::error::ARM GNU toolchain 下载失败"
            exit 1
          fi

          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"
          echo "GCC_DIR=$GCC_DIR" >> "$GITHUB_ENV"
          echo "GCC_BIN=$GCC_BIN" >> "$GITHUB_ENV"
          echo "GCC_PREFIX=$GCC_PREFIX" >> "$GITHUB_ENV"
          echo "FOUND=true" >> "$GITHUB_OUTPUT"

      # ── 建立 toolchain 软链接 ────────────────────────────────────
      - name: 建立 toolchain 软链接
        run: |
          CLANG_DIR="${{ env.CLANG_DIR }}"
          GCC_DIR="${{ env.GCC_DIR }}"
          GCC_BIN="${{ env.GCC_BIN }}"
          GCC_PREFIX="${{ env.GCC_PREFIX }}"
          TOOLCHAIN_BIN="$GITHUB_WORKSPACE/kernel/toolchain/bin"
          mkdir -p "$TOOLCHAIN_BIN"

          # 清理旧链接
          rm -f "$TOOLCHAIN_BIN"/aarch64-linux-gnu-* "$TOOLCHAIN_BIN"/cc "$TOOLCHAIN_BIN"/gcc "$TOOLCHAIN_BIN"/g++

          # 找 clang 可执行文件
          if [ -x "$CLANG_DIR/bin/clang" ]; then
            CLANG="$CLANG_DIR/bin/clang"
            CLANG12="$CLANG_DIR/bin/clang-12"
          elif ls "$CLANG_DIR/bin"/clang-12* &>/dev/null; then
            CLANG12=$(ls "$CLANG_DIR/bin"/clang-12* | head -1)
            CLANG="$CLANG12"
          else
            echo "::error::找不到 clang 可执行文件: $CLANG_DIR"
            ls -la "$CLANG_DIR/bin/" 2>/dev/null | head -20
            exit 1
          fi

          echo "Clang: $CLANG"
          $CLANG --version | head -1

          # 找 ARM GNU as/ld，并统一暴露为内核使用的 aarch64-linux-gnu 前缀
          if [ -z "$GCC_BIN" ] || [ -z "$GCC_PREFIX" ] || [ ! -x "$GCC_BIN/${GCC_PREFIX}as" ]; then
            echo "::error::未找到 ARM GNU assembler"
            exit 1
          fi

          # 建立 aarch64 前缀链接
          ln -sf "$CLANG" "$TOOLCHAIN_BIN/aarch64-linux-gnu-gcc"
          ln -sf "$CLANG" "$TOOLCHAIN_BIN/aarch64-linux-gnu-g++"
          ln -sf "$CLANG" "$TOOLCHAIN_BIN/cc"
          ln -sf "$CLANG" "$TOOLCHAIN_BIN/gcc"
          ln -sf "$CLANG12" "$TOOLCHAIN_BIN/g++" 2>/dev/null || ln -sf "$CLANG" "$TOOLCHAIN_BIN/g++"

          for tool in ld ar nm objcopy objdump strip; do
            src="$CLANG_DIR/bin/llvm-${tool}"
            [ -x "$src" ] && ln -sf "$src" "$TOOLCHAIN_BIN/aarch64-linux-gnu-${tool}"
          done
          # llvm-ar 有时叫 llvm-ar
          [ -x "$CLANG_DIR/bin/llvm-ar" ] && ln -sf "$CLANG_DIR/bin/llvm-ar" "$TOOLCHAIN_BIN/aarch64-linux-gnu-ar"

          # GNU as（5.4 内核需要外部 assembler）
          ln -sf "$GCC_BIN/${GCC_PREFIX}as" "$TOOLCHAIN_BIN/aarch64-linux-gnu-as"
          echo "GNU as: $GCC_BIN/${GCC_PREFIX}as"

          echo "toolchain/bin:"
          ls -la "$TOOLCHAIN_BIN"

      # ── 集成 KernelSU (BakaSU, 原 ReSukiSU) ──────────────────────
      # reukisu:  克隆 BakaSU 并链接为内建/LKM 驱动
      # none:     内核树 drivers/Kconfig 已 source drivers/kernelsu/Kconfig
      #           (符号链接悬空时 Kconfig 直接 exit(1)), 必须摘掉这两处引用
      - name: 集成 KernelSU (BakaSU)
        id: ksu_sha
        run: |
          KERNEL_ROOT="$GITHUB_WORKSPACE/kernel"
          DRIVER_DIR="$KERNEL_ROOT/drivers"

          if [ "${{ inputs.ksu_variant }}" = "reukisu" ]; then
            KSU_RELEASES=$(curl --fail --location --silent --show-error --retry 3 \
              'https://api.github.com/repos/Baka-SU/BakaSU/releases?per_page=1')
            KSU_TAG=$(jq -er '.[0].tag_name | select(type == "string" and length > 0)' <<< "$KSU_RELEASES")
            KSU_MANAGER_URL=$(jq -er --arg tag "$KSU_TAG" '
              [.[0].assets[]
                | select(.name | contains($tag) and endswith("-arm64-v8a-release.apk"))
                | .browser_download_url]
              | if length == 1 then .[0] else error("expected one matching arm64 Manager APK") end
            ' <<< "$KSU_RELEASES")
            echo "Latest BakaSU release: $KSU_TAG"

            git clone --depth=1 --branch "$KSU_TAG" \
              https://github.com/Baka-SU/BakaSU.git "$KERNEL_ROOT/KernelSU"

            # Keep the kernel driver and its signing-compatible Manager on one release.
            KSU_SHA=$(git -C "$KERNEL_ROOT/KernelSU" rev-parse HEAD)
            echo "ksu_sha=$KSU_SHA" >> "$GITHUB_OUTPUT"
            echo "ksu_tag=$KSU_TAG" >> "$GITHUB_OUTPUT"
            echo "ksu_manager_url=$KSU_MANAGER_URL" >> "$GITHUB_OUTPUT"
            echo "BakaSU release commit: $KSU_SHA"
            KSU_KERNEL_DIR="$KERNEL_ROOT/KernelSU/kernel"

            # 树里已提交符号链接 drivers/kernelsu -> ../KernelSU/kernel，
            # 仅在缺失时重建（注意相对层数：从 drivers/ 出发一层）
            if [ ! -L "$DRIVER_DIR/kernelsu" ]; then
              ln -sfn "../KernelSU/kernel" "$DRIVER_DIR/kernelsu"
              echo "已创建 drivers/kernelsu -> ../KernelSU/kernel"
            else
              echo "复用树内链接: $(readlink "$DRIVER_DIR/kernelsu")"
            fi

            # 确保 Makefile 包含 KSU
            if ! grep -q "kernelsu" "$DRIVER_DIR/Makefile"; then
              echo '' >> "$DRIVER_DIR/Makefile"
              echo 'obj-$(CONFIG_KSU) += kernelsu/'
              echo "已添加 KSU 到 drivers/Makefile"
            fi

            # 确保 Kconfig 包含 KSU
            if ! grep -q "drivers/kernelsu/Kconfig" "$DRIVER_DIR/Kconfig"; then
              sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' "$DRIVER_DIR/Kconfig"
              echo "已添加 KSU 到 drivers/Kconfig"
            fi

            echo "KernelSU 集成完成"
          else
            echo "ksu_variant=none: 摘除 drivers 树里的 KSU 引用（避免悬空 source 导致 Kconfig 退出）"
            sed -i '/source "drivers\/kernelsu\/Kconfig"/d' "$DRIVER_DIR/Kconfig"
            sed -i '/obj-$(CONFIG_KSU) += kernelsu\//d' "$DRIVER_DIR/Makefile"
            echo "已摘除 KSU 引用"
          fi

      # ── 集成 Hybrid Mount VFS ────────────────────────────────────
      - name: 集成 Hybrid Mount VFS
        run: |
          KERNEL_ROOT="$GITHUB_WORKSPACE/kernel"
          SOURCE_DIR="$RUNNER_TEMP/meta-hybrid_mount"
          RELEASE_TAG=$(curl --fail --location --silent --show-error --retry 3 \
            https://api.github.com/repos/Hybrid-Mount/meta-hybrid_mount/releases/latest \
            | jq -er '.tag_name | select(type == "string" and length > 0)')
          echo "Latest Hybrid Mount release: $RELEASE_TAG"

          mkdir -p "$SOURCE_DIR"
          git -C "$SOURCE_DIR" init
          git -C "$SOURCE_DIR" remote add origin "$HYBRID_MOUNT_REPO"
          git -C "$SOURCE_DIR" fetch --depth=1 origin "refs/tags/$RELEASE_TAG"
          git -C "$SOURCE_DIR" checkout --detach FETCH_HEAD

          ACTUAL_COMMIT=$(git -C "$SOURCE_DIR" rev-parse HEAD)
          echo "Hybrid Mount release commit: $ACTUAL_COMMIT"

          cd "$KERNEL_ROOT"
          "$SOURCE_DIR/module/vfs/setup.sh"
          grep -qF 'source "fs/hybridmount/Kconfig"' fs/Kconfig
          grep -qF 'obj-$(CONFIG_HYBRIDMOUNT) += hybridmount/' fs/Makefile

      # ── 集成最新官方 Re-Kernel ────────────────────────────────────
      - name: 集成 Re-Kernel
        id: rekernel
        run: |
          set -euo pipefail
          KERNEL_ROOT="$GITHUB_WORKSPACE/kernel"
          SOURCE_DIR="$RUNNER_TEMP/Re-Kernel"
          DEFCONFIG="$KERNEL_ROOT/arch/arm64/configs/vendor/gts7fewifi_eur_open_defconfig"

          RELEASE=$(curl --fail --location --silent --show-error --retry 3 \
            "https://api.github.com/repos/${REKERNEL_REPO}/releases/latest")
          RELEASE_TAG=$(jq -er '.tag_name | select(type == "string" and length > 0)' <<< "$RELEASE")
          echo "Latest Re-Kernel release: $RELEASE_TAG"

          git clone --depth=1 --branch "$RELEASE_TAG" \
            "https://github.com/${REKERNEL_REPO}.git" "$SOURCE_DIR"
          RELEASE_SHA=$(git -C "$SOURCE_DIR" rev-parse HEAD)
          echo "Re-Kernel release commit: $RELEASE_SHA"

          # The upstream script targets generic ARM64 defconfig; this device builds its vendor defconfig.
          if ! grep -qF 'arch/arm64/configs/defconfig' "$SOURCE_DIR/Integrate/patches.sh"; then
            echo "::error::upstream Re-Kernel integration script no longer has the expected defconfig target"
            exit 1
          fi
          sed -i \
            's|arch/arm64/configs/defconfig|arch/arm64/configs/vendor/gts7fewifi_eur_open_defconfig|' \
            "$SOURCE_DIR/Integrate/patches.sh"

          cd "$KERNEL_ROOT"
          bash "$SOURCE_DIR/Integrate/patches.sh"

          # The upstream script can skip unsupported anchors without failing, so verify every integration point.
          test -f "$KERNEL_ROOT/drivers/rekernel/rekernel.c"
          grep -qF 'source "drivers/rekernel/Kconfig"' "$KERNEL_ROOT/drivers/Kconfig"
          grep -qF 'obj-$(CONFIG_REKERNEL) += rekernel/' "$KERNEL_ROOT/drivers/Makefile"
          grep -qF 'rekernel_binder_transaction(reply, t, target_node, tr)' "$KERNEL_ROOT/drivers/android/binder.c"
          grep -qF 'rekernel_report(SIGNAL' "$KERNEL_ROOT/kernel/signal.c"
          grep -q '^CONFIG_REKERNEL=y$' "$DEFCONFIG"
          grep -q '^CONFIG_REKERNEL_NETWORK=n$' "$DEFCONFIG"

          echo "rekernel_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "rekernel_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      # ── 配置内核选项 ─────────────────────────────────────────────
      - name: 配置内核选项
        run: |
          KERNEL_ROOT="$GITHUB_WORKSPACE/kernel"
          DEFCONFIG="$KERNEL_ROOT/arch/arm64/configs/vendor/gts7fewifi_eur_open_defconfig"

          # USER_NS 已固化进 defconfig; 此处仅作兜底（幂等）
          if ! grep -q "^CONFIG_USER_NS=y" "$DEFCONFIG"; then
            sed -i '/^CONFIG_NAMESPACES=y$/a CONFIG_USER_NS=y' "$DEFCONFIG"
            echo "已添加 CONFIG_USER_NS=y"
          fi

          # 确保生成 ARM64 device tree overlay
          if ! grep -q "^CONFIG_BUILD_ARM64_DT_OVERLAY=y" "$DEFCONFIG"; then
            echo "CONFIG_BUILD_ARM64_DT_OVERLAY=y" >> "$DEFCONFIG"
            echo "已添加 CONFIG_BUILD_ARM64_DT_OVERLAY=y"
          fi

          # Hybrid Mount VFS is built into this kernel image.
          sed -i '/^CONFIG_HYBRIDMOUNT=/d' "$DEFCONFIG"
          echo "CONFIG_HYBRIDMOUNT=y" >> "$DEFCONFIG"

          VARIANT="${{ inputs.build_variant || 'resukisu' }}"
          if [ "${{ inputs.ksu_variant }}" = "reukisu" ]; then
            # KSU 主开关: resukisu 内建(=y), lkm 编为模块(=m)
            KSU_VAL="y"
            [ "$VARIANT" = "lkm" ] && KSU_VAL="m"
            for opt in \
              "CONFIG_KSU=${KSU_VAL}" \
              "CONFIG_KSU_MANUAL_HOOK=y" \
              "CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y" \
              "CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y" \
              "CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y"; do
              cfg="${opt%%=*}"
              val="${opt#*=}"
              # 先删除同符号旧行再追加, 避免重复/冲突
              sed -i "/^${cfg}=/d" "$DEFCONFIG"
              echo "$cfg=$val" >> "$DEFCONFIG"
            done
            echo "KSU 变体: $VARIANT → CONFIG_KSU=${KSU_VAL}"
          else
            # 无 KSU: 清掉 KSU 配置, 防止残留 =y 引用已摘除的代码
            sed -i '/^CONFIG_KSU/d' "$DEFCONFIG"
            echo "已清除全部 CONFIG_KSU* 配置"
          fi

          # 禁止自动追加 Git dirty/version 后缀，避免 utsrelease 超过 64 字符
          sed -i '/^CONFIG_LOCALVERSION_AUTO=/d' "$DEFCONFIG"
          echo "CONFIG_LOCALVERSION_AUTO=n" >> "$DEFCONFIG"

          echo "── 关键配置 ──"
          grep -E "CONFIG_USER_NS|CONFIG_KSU|CONFIG_HYBRIDMOUNT|CONFIG_NAMESPACES|CONFIG_PID_NS|CONFIG_SYSVIPC|CONFIG_POSIX_MQUEUE" "$DEFCONFIG" || true

      # ── 准备 AnyKernel3 ──────────────────────────────────────────
      # 官方 osm0sis 版 + 内嵌 anykernel.sh（取自 Y 大佬可用包:
      # 只刷 boot, do.devicecheck=0; WildKernels 分支写死了 5.10+ 检查
      # 会把 5.4 内核 "Non-GKI device, abort." 拒刷）
      - name: 准备 AnyKernel3
        run: |
          KERNEL_ROOT="$GITHUB_WORKSPACE/kernel"
          AK3_DIR="$KERNEL_ROOT/build/AnyKernel3"
          if [ ! -d "$AK3_DIR" ]; then
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$AK3_DIR"
          fi
          rm -rf "$AK3_DIR/.git"
          rm -f "$AK3_DIR/anykernel.sh" "$AK3_DIR/README.md"
          printf '%s' '' | base64 -d > "$AK3_DIR/anykernel.sh"
          chmod +x "$AK3_DIR/anykernel.sh"
          echo "AnyKernel3: $AK3_DIR"
          head -8 "$AK3_DIR/anykernel.sh"

      # ── 编译内核 ─────────────────────────────────────────────────
      - name: 编译内核
        id: compile
        run: |
          set -e
          KERNEL_ROOT="$GITHUB_WORKSPACE/kernel"
          TOOLCHAIN_BIN="$KERNEL_ROOT/toolchain/bin"
          CLANG_DIR="${{ env.CLANG_DIR }}"

          export PATH="$TOOLCHAIN_BIN:$CLANG_DIR/bin:$PATH"
          export ARCH=arm64

          # 5.4 qGKI 需要 CROSS_COMPILE（指向 ARM GNU as/ld）+ LLVM=1
          # 根据 ravindu644 教程：5.4 需要 Clang + GCC cross compiler
          export CROSS_COMPILE="$TOOLCHAIN_BIN/aarch64-linux-gnu-"
          export AS="$TOOLCHAIN_BIN/aarch64-linux-gnu-as"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LLVM=1
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          # 与本地 build_local.sh 对齐；该树的一个旧驱动函数会触发 Clang Werror
          export KCFLAGS="-Wno-error=unused-function"

          # ccache: CC 经 export + make 命令行 DISABLE_WRAPPER=1 CC="$CC"
          # 传入。wrapper 被禁用后不会拦截 warning, KCFLAGS 保留为双保险
          VARIANT="${{ inputs.build_variant || 'resukisu' }}"
          if [ "${{ inputs.use_ccache }}" = "true" ] && command -v ccache &>/dev/null; then
            export CC="ccache clang"
            echo "ccache 已启用: CC=$CC"
          else
            export CC=clang
          fi

          OUT_DIR="$KERNEL_ROOT/out"
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          LOCALVERSION="${{ env.LOCALVERSION_BASE }}"

          echo "=============================================="
          echo " SM7325 Kernel Build"
          echo "=============================================="
          echo " Device:    ${{ env.DEVICE_CODENAME }}"
          echo " Defconfig: ${{ env.DEFCONFIG }}"
          echo " Variant:   $VARIANT (ksu: ${{ inputs.ksu_variant }})"
          echo " Re-Kernel: ${{ steps.rekernel.outputs.rekernel_tag }} (${{ steps.rekernel.outputs.rekernel_sha }})"
          echo " Version:   $LOCALVERSION"
          echo " CC:        $CC"
          echo " CROSS:     $CROSS_COMPILE"
          echo " AS:        $AS"
          echo " KCFLAGS:   $KCFLAGS"
          echo " DTC_EXT:   $DTC_EXT"
          echo " JOBS:      $(nproc)"
          echo " OUT:       $OUT_DIR"
          echo "=============================================="

          MAKE_ARGS=( -j"$(nproc)" -C "$KERNEL_ROOT" O="$OUT_DIR"
            ARCH=arm64
            CROSS_COMPILE="$CROSS_COMPILE"
            CLANG_TRIPLE=aarch64-linux-gnu-
            DTC_EXT="$KERNEL_ROOT/tools/dtc"
            LOCALVERSION_AUTO=0
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y
            KCFLAGS="$KCFLAGS"
            LLVM=1
            LD=ld.lld
            # 三星树 Makefile 默认 CC=$(gcc-wrapper.py)，wrapper 会把任何
            # 未白名单的 warning 升级为 fatal（如 techpack/audio lahaina.c
            # 的 unused-function）。命令行传 CC 同时关掉 wrapper。
            DISABLE_WRAPPER=1
            CC="$CC" )

          # [1/3] 生成 .config
          echo ""; echo "[1/3] 生成 .config..."
          make "${MAKE_ARGS[@]}" "${{ env.DEFCONFIG }}" 2>&1 | tee "$OUT_DIR/build.log"
          # make 在管道里时 set -e 看不到退出码, 用 PIPESTATUS 检查
          [ "${PIPESTATUS[0]}" -eq 0 ] || { echo "::error::defconfig 生成失败"; exit 1; }
          grep -q '^CONFIG_HYBRIDMOUNT=y$' "$OUT_DIR/.config" || {
            echo "::error::CONFIG_HYBRIDMOUNT=y missing from generated .config"
            exit 1
          }
          grep -q '^CONFIG_REKERNEL=y$' "$OUT_DIR/.config" || {
            echo "::error::CONFIG_REKERNEL=y missing from generated .config"
            exit 1
          }

          # [2/3] 编译
          echo ""; echo "[2/3] 编译内核..."
          make "${MAKE_ARGS[@]}" LOCALVERSION="$LOCALVERSION" 2>&1 | tee -a "$OUT_DIR/build.log"
          [ "${PIPESTATUS[0]}" -eq 0 ] || { echo "::error::内核编译失败, 见 build.log 末尾:"; tail -80 "$OUT_DIR/build.log"; exit 1; }

          # 验证 Image
          IMAGE="$OUT_DIR/arch/arm64/boot/Image"
          if [ ! -f "$IMAGE" ]; then
            echo "::error::Image 未找到: $IMAGE"
            echo "构建日志 tail:"
            tail -80 "$OUT_DIR/build.log" 2>/dev/null || true
            exit 1
          fi
          echo ""
          echo "✓ 内核编译成功"
          echo "  大小: $(ls -lh "$IMAGE" | awk '{print $5}')"
          echo "  版本: $(strings "$IMAGE" | grep 'Linux version' | head -1)"

          # [3/3] 打包 AnyKernel3
          echo ""; echo "[3/3] 打包 AnyKernel3..."
          AK3_DIR="$KERNEL_ROOT/build/AnyKernel3"
          rm -rf "${AK3_DIR}/Image" "${AK3_DIR}/dtb" "${AK3_DIR}/dtbo.img" "${AK3_DIR}/modules" 2>/dev/null || true

          cp "$IMAGE" "$AK3_DIR/" && echo "  ✓ Image"
          mkdir -p "$AK3_DIR/dtb"
          find "$OUT_DIR/arch/arm64/boot/dts" -name "*.dtb" -exec cp {} "$AK3_DIR/dtb/" \; 2>/dev/null && echo "  ✓ DTB" || true
          [ -f "$OUT_DIR/arch/arm64/boot/dtbo.img" ] && cp "$OUT_DIR/arch/arm64/boot/dtbo.img" "$AK3_DIR/" && echo "  ✓ DTBO" || true

          # 收集模块
          if ls "$OUT_DIR"/*.ko 2>/dev/null | head -1 > /dev/null; then
            mkdir -p "$AK3_DIR/modules"
            find "$OUT_DIR" -name "*.ko" -not -path "*/vendor/*" -exec cp {} "$AK3_DIR/modules/" \; 2>/dev/null
            echo "  ✓ Modules"
          fi

          TIMESTAMP=$(date '+%Y%m%d-%H%M%S')
          KSU_TAG="${{ inputs.ksu_variant == 'reukisu' && 'KSU' || 'noKSU' }}"
          ZIP_NAME="TabS7FE_Kernel-${VARIANT}-${KSU_TAG}-ReKernel-${{ steps.rekernel.outputs.rekernel_tag }}-${TIMESTAMP}-GitHub.zip"
          (cd "$AK3_DIR" && zip -r9 "$OUT_DIR/$ZIP_NAME" . -x '.git*' '*.gitignore' 'README*' '*placeholder')

          echo ""
          echo "=============================================="
          echo " BUILD SUCCESS"
          echo "=============================================="
          echo " Artifact: $OUT_DIR/$ZIP_NAME"
          ls -lh "$OUT_DIR/$ZIP_NAME"
          echo "=============================================="

          echo "ZIP_PATH=$OUT_DIR/$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      # ── 上传产物 ──────────────────────────────────────────────────
      - name: 上传内核 zip
        uses: actions/upload-artifact@v6
        with:
          name: kernel-${{ inputs.build_variant || 'resukisu' }}-${{ inputs.ksu_variant == 'reukisu' && 'KSU' || 'noKSU' }}-ReKernel-${{ steps.rekernel.outputs.rekernel_tag }}
          path: ${{ steps.compile.outputs.ZIP_PATH }}
          retention-days: 14

      - name: 上传构建日志（失败时调试用）
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: buildlog-${{ inputs.build_variant || 'resukisu' }}-${{ inputs.ksu_variant }}
          path: ${{ github.workspace }}/kernel/out/build.log
          retention-days: 7

      - name: 上传 .config（始终，用于与 Y 大佬 IKCONFIG 对比排查 CRC）
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: config-${{ inputs.build_variant || 'resukisu' }}-${{ inputs.ksu_variant }}
          path: ${{ github.workspace }}/kernel/out/.config
          retention-days: 7

  # ── 配套管理器: 与内核使用同一 BakaSU release ──────────────────
  # 自编管理器的签名不匹配内核；复用该 release 的官方 APK。
  manager:
    name: "BakaSU-Manager (配套 ${{ needs.build.outputs.ksu_tag }})"
    runs-on: ubuntu-latest
    needs: build
    if: always() && needs.build.result == 'success' && inputs.ksu_variant == 'reukisu'
    timeout-minutes: 15

    steps:
      - name: 下载配套官方 release 管理器
        run: |
          MANAGER_URL="${{ needs.build.outputs.ksu_manager_url }}"
          if [ -z "$MANAGER_URL" ]; then
            echo "::error::matching BakaSU Manager APK URL was not produced"
            exit 1
          fi
          curl --fail --location --silent --show-error --retry 3 -o manager.apk "$MANAGER_URL"
          ls -lh manager.apk
          cp manager.apk "$GITHUB_WORKSPACE/ReSukiSU-manager-${{ needs.build.outputs.ksu_tag }}.apk"

      - name: 上传管理器 APK
        uses: actions/upload-artifact@v6
        with:
          name: manager-${{ needs.build.outputs.ksu_tag }}-${{ inputs.build_variant || 'resukisu' }}-KSU
          path: ReSukiSU-manager-*.apk
          retention-days: 14
